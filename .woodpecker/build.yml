when:
  event: [push, manual]
  branch: main
  path:
    include:
      - deploy/*
      - src/**/*
      - public/**/*
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - next.config.ts
      - tsconfig.json
      - postcss.config.mjs
      - nginx.conf
      - Dockerfile
      - .dockerignore
      - .woodpecker/*

variables:
  - &alpine "alpine:3.24"
  - &buildkit "moby/buildkit:v0.31.2"

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1
      lfs: false

steps:
  fetch-data:
    image: *alpine
    environment:
      CMS_API_BASE: https://api.intikepri.com
    commands:
      - apk add --no-cache curl jq
      - mkdir -p src/data
      - |
        for f in news:news gallery:gallery business:business; do
          out="${f%%:*}"; ep="${f##*:}"
          if curl -fsSL "${CMS_API_BASE}/api/${ep}" -o "/tmp/${out}.raw.json" \
             && jq -e '.data.items' "/tmp/${out}.raw.json" > "src/data/${out}.json.tmp" 2>/dev/null; then
            mv "src/data/${out}.json.tmp" "src/data/${out}.json"
            echo "fetched ${out}.json ($(jq length "src/data/${out}.json") items)"
          else
            echo "WARNING: failed to fetch ${out} from ${CMS_API_BASE}, keeping committed data"
          fi
        done
      - |
        for f in news gallery business; do
          if [ ! -f "src/data/$f.json" ]; then
            echo "ERROR: src/data/$f.json missing after fetch"
            exit 1
          fi
        done

  build-and-push:
    image: *buildkit
    depends_on: [fetch-data]
    environment:
      DOCKER_PASSWORD:
        from_secret: docker_password
    commands:
      - mkdir -p ~/.docker
      - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"izayoilv\",\"password\":\"$DOCKER_PASSWORD\"}}}" > ~/.docker/config.json
      - TAG="build-$(printf '%06d' ${CI_PIPELINE_NUMBER})-sha-${CI_COMMIT_SHA:0:8}"
      - |
        for i in 1 2 3; do
          buildctl --addr tcp://buildkitd-service.buildkitd.svc:1234 build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --output type=image,name=docker.io/izayoilv/intikepri-static:latest,push=true \
            --output type=image,name=docker.io/izayoilv/intikepri-static:$TAG,push=true && break
          if [ $i -eq 3 ]; then
            echo "All BuildKit push attempts failed."
            exit 1
          fi
          echo "BuildKit failed (attempt $i/3), retrying in 10s..."
          sleep 10
        done

  verify:
    image: *alpine
    depends_on: [build-and-push]
    commands:
      - apk add --no-cache curl jq
      - |
        TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:izayoilv/intikepri-static:pull" | jq -r .token)
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://registry-1.docker.io/v2/izayoilv/intikepri-static/manifests/latest" -H "Accept: application/vnd.oci.image.manifest.v1+json")
        echo "HTTP status = $STATUS"
        if [ "$STATUS" != "200" ]; then echo "FAIL"; exit 1; fi
        echo "OK"
