when:
  event: [push, manual]
  branch: main
  path:
    include:
      - deploy/*
      - src/**/*
      - public/**/*
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - next.config.ts
      - tsconfig.json
      - postcss.config.mjs
      - config.toml
      - Dockerfile
      - .dockerignore
      - .woodpecker/*

variables:
  - &alpine "alpine:3.24"
  - &buildkit "moby/buildkit:v0.31.2"

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 1
      lfs: false

steps:
  fetch-data:
    image: *alpine
    commands:
      - apk add --no-cache curl jq
      - mkdir -p src/data
      - |
        set -e
        fetch() {
          ep="$1"; out="$2"
          curl -fsSL "https://api.intikepri.com/api/$ep" -o "/tmp/$out.json" || { echo "WARNING: failed to fetch $out"; return 1; }
          jq -e '.data.items' "/tmp/$out.json" > "src/data/$out.json" || { echo "WARNING: invalid response for $out"; return 1; }
          echo "fetched $out.json ($(jq length "src/data/$out.json") items)"
        }
        fetch news news
        fetch gallery gallery
        fetch business business
        fetch agenda agenda
        fetch documents document
        fetch video video
      - |
        for f in news gallery business agenda document video; do
          if [ ! -s "src/data/$f.json" ]; then
            echo "ERROR: src/data/$f.json missing or empty after fetch"
            exit 1
          fi
        done

  build-and-push:
    image: *buildkit
    depends_on: [fetch-data]
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - mkdir -p ~/.docker
      - echo "{\"auths\":{\"registry.kudofools.dev\":{\"username\":\"$${REGISTRY_USERNAME}\",\"password\":\"$${REGISTRY_PASSWORD}\"}}}" > ~/.docker/config.json
      - TAG="build-$(printf '%06d' ${CI_PIPELINE_NUMBER})-sha-${CI_COMMIT_SHA:0:8}"
      - |
        for i in 1 2 3; do
          buildctl --addr tcp://buildkitd-service.buildkitd.svc:1234 build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --output type=image,name=registry.kudofools.dev/intikepri/intikepri-static:latest,push=true \
            --output type=image,name=registry.kudofools.dev/intikepri/intikepri-static:$TAG,push=true && break
          if [ $i -eq 3 ]; then
            echo "All BuildKit push attempts failed."
            exit 1
          fi
          echo "BuildKit failed (attempt $i/3), retrying in 10s..."
          sleep 10
        done

  verify:
    image: *alpine
    depends_on: [build-and-push]
    commands:
      - apk add --no-cache curl
      - |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.kudofools.dev/v2/intikepri/intikepri-static/manifests/latest" -H "Accept: application/vnd.oci.image.manifest.v1+json")
        echo "HTTP status = $STATUS"
        if [ "$STATUS" != "200" ]; then echo "FAIL"; exit 1; fi
        echo "OK"
